# ClipForge reverse proxy — single entry point at http://localhost.
# Routes:  /api/* -> clipforge-api:8000, everything else -> clipforge-frontend.

# Docker's embedded DNS: re-resolve upstreams so container IP changes (e.g.
# `docker compose up -d --build clipforge-api`) do not leave stale upstreams
# (502) until nginx restarts. `resolve` requires nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream clipforge_api {
    zone clipforge_api 64k;
    server clipforge-api:8000 resolve;
}

upstream clipforge_frontend {
    zone clipforge_frontend 64k;
    server clipforge-frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    # Uploads (video files) can be large; raised for the import endpoints.
    client_max_body_size 4g;

    # Container liveness probe (no upstream involved).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://clipforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://clipforge_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
