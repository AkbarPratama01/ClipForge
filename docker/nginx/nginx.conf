# ClipForge reverse proxy — single entry point at http://localhost.
# Routes:  /api/* -> clipforge-api:8000, everything else -> clipforge-frontend.

upstream clipforge_api {
    server clipforge-api:8000;
}

upstream clipforge_frontend {
    server clipforge-frontend:80;
}

server {
    listen 80;
    server_name _;

    # Uploads (video files) can be large; raised for the import endpoints.
    client_max_body_size 4g;

    # Container liveness probe (no upstream involved).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://clipforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://clipforge_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
